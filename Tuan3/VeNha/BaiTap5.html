
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 5 - Best Shared Hosting</title>

    <style>
        /* Định dạng chung */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        /* Khu vực bài tập */
        .best-shared {
            max-width: 1100px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        /* Logo BIT */
        .best-shared .logo {
            margin: 0 0 32px;
        }

        .best-shared .logo img {
            display: block;
            width: 200px;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }

        /* Tiêu đề */
        .best-shared h2 {
            margin: 0 0 28px;
            font-size: 36px;
            font-weight: 400;
            line-height: 1.3;
        }

        .best-shared h2 strong {
            color: #00aeef;
            font-weight: 700;
        }

        /* Đoạn mô tả */
        .best-shared .lead-text {
            margin: 0 auto 32px;
            font-size: 15px;
            line-height: 1.7;
            color: #555555;
        }

        /* Danh sách nút */
        .best-shared .btn-list {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .best-shared .btn-list li {
            display: inline-block;
            margin: 0 8px 12px;
        }

        .best-shared .btn-list a {
            display: inline-block;
            min-width: 140px;
            padding: 18px 24px;

            background-color: #30343a;
            color: #ffffff;

            font-size: 14px;
            text-align: center;
            text-decoration: none;

            border-radius: 3px;
            transition: background-color 0.2s ease;
        }

        /* Hiệu ứng tương tác */
        .best-shared .btn-list a:hover {
            background-color: #00aeef;
        }

        .best-shared .btn-list a:focus-visible {
            outline: 3px solid #00aeef;
            outline-offset: 3px;
        }

        /* Liên kết quay lại */
        .back-link {
            display: block;
            width: fit-content;
            margin: 50px auto 20px;
            color: #087d83;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .best-shared {
                margin: 35px auto;
            }

            .best-shared h2 {
                font-size: 28px;
            }

            .best-shared .lead-text {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Nội dung HTML theo đề bài -->
    <section class="best-shared">

        <p class="logo">
            <img src="./images/BIT%20logo.jpg"
                 alt="Logo Khoa Công nghệ Thông tin Kinh doanh UEH">
        </p>

        <h2>
            Best <strong>Shared Hosting</strong> Company
        </h2>

        <p class="lead-text">
            With this responsive landing page template,
            you can promote your all hosting,
            domain and email services.
        </p>

        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>

    </section>

    <a href="./index.html" class="back-link">
        ← Quay lại danh sách bài tập
    </a>

</body>
</html>
